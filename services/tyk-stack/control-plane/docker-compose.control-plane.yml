services:
  # ---------------- Base services ----------------
  tyk-gateway:
    image: tykio/tyk-gateway:${GATEWAY_VERSION:-v5.6.1}
    container_name: tyk-control-plane-gateway
    ports:
      - "8080:8080"
    env_file:
      - tyk-stack/control-plane/confs/gateway.conf
    volumes:
      - ../ca/ca.crt:/etc/ssl/certs/ca-certificates.crt:ro
    networks:
      - api-gateway-env

  tyk-redis:
    image: redis
    container_name: tyk-control-plane-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - api-gateway-env

  # ---------------- MongoDB override services ----------------
  tyk-dashboard:
    image: tykio/tyk-dashboard:${DASHBOARD_VERSION:-v5.6.1}
    container_name: tyk-control-plane-dashboard
    environment:
      - TYK_DB_LICENSEKEY=${DASH_LICENSE:?License key missing from Docker environment file "".env" file.}
    ports:
      - "3000:3000"
    env_file:
      - tyk-stack/control-plane/confs/dashboard.conf
    volumes:
      - ../ca/ca.crt:/etc/ssl/certs/ca-certificates.crt:ro
    networks:
      - api-gateway-env

  tyk-mdcb:
    image: tykio/tyk-mdcb-docker:${MDCB_VERSION:-v2.5.1}
    container_name: tyk-control-plane-mdcb
    environment:
      - TYK_MDCB_LICENSE=${MDCB_LICENSE:?License key missing from Docker environment file "".env" file.}
    env_file:
      - tyk-stack/control-plane/confs/mdcb.conf
    volumes:
      - ./nginx/certs:/etc/mdcb/certs:ro
    networks:
      - api-gateway-env

  tyk-mongo:
    image: mongo:latest
    container_name: tyk-mongo
    command: ["mongod"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - api-gateway-env

# ---------------- Volumes ----------------
volumes:
  redis-data:
    name: tyk-control-plane-redis-data
  mongo-data:
    name: tyk-control-plane-mongo-data
 